    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tomorrow_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      @keyframes tmSplashBar {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(130%); }
        100% { transform: translateX(-100%); }
      }
      #tm-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
      }
      #tm-boot-splash img {
        width: 144px;
        height: 144px;
        border-radius: 24px;
        object-fit: contain;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      }
      #tm-boot-track {
        width: 112px;
        height: 2px;
        background: #e2e8f0;
        border-radius: 9999px;
        overflow: hidden;
      }
      #tm-boot-bar {
        width: 48px;
        height: 100%;
        background: #000000;
        border-radius: 9999px;
        animation: tmSplashBar 1.25s ease-in-out infinite;
